name: Update Feed

on:
  schedule:
    - cron: '0 18 * * 3' # weekly, Wednesday 18:00 UTC: the day after Patch Tuesday, and out-of-band updates
    - cron: '0 2 17 * *' # monthly, 17th 02:00 UTC: 2+ days after Patch Tuesday (day 8-14) for catalog publishing lag
  workflow_dispatch: # manual trigger

permissions:
  contents: write # create the feed branch and commit
  pull-requests: write # open the feed PR
  actions: write # start the format check on the feed branch
  issues: write # raise an issue on failure

jobs:
  generate:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate feed
        shell: pwsh
        run: ./scripts/Update-Feed.ps1

      # main requires a PR and signed commits. The commit is made through the
      # GraphQL API so GitHub signs it. File contents come from the git index, so
      # line endings match the repo, not the Windows checkout.
      - name: Open feed PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add docs/
          if git diff --cached --quiet -- docs/; then
            echo "No feed changes to commit."
            exit 0
          fi

          day=$(date -u +%Y-%m-%d)
          title="Update feed $day"
          branch="feed/$day-$GITHUB_RUN_ID"
          head=$(git rev-parse HEAD)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$head" > /dev/null

          changes='{"additions":[],"deletions":[]}'
          while IFS=$'\t' read -r status path; do
            if [ "$status" = "D" ]; then
              changes=$(jq --arg p "$path" '.deletions += [{path: $p}]' <<< "$changes")
            else
              content=$(git cat-file blob ":$path" | base64 -w0)
              changes=$(jq --arg p "$path" --arg c "$content" '.additions += [{path: $p, contents: $c}]' <<< "$changes")
            fi
          done < <(git diff --cached --no-renames --name-status -- docs/)

          jq -n --arg repo "$GITHUB_REPOSITORY" --arg branch "$branch" --arg head "$head" \
            --arg title "$title" --argjson changes "$changes" '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                message: { headline: $title },
                expectedHeadOid: $head,
                fileChanges: $changes
              } }
            }' > "$RUNNER_TEMP/commit.json"
          gh api graphql --input "$RUNNER_TEMP/commit.json" --jq '.data.createCommitOnBranch.commit.oid'

          gh pr create --base main --head "$branch" --title "$title" \
            --body "Feed regenerated by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          # A PR opened with the Actions token does not start other workflows; start the check directly.
          gh workflow run format.yml --ref "$branch"

      - name: Raise issue on failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $title = "Update feed failed $(Get-Date -Format 'yyyy-MM-dd')"
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh issue create --title $title --label bug --body "The scheduled feed run failed. Logs: $runUrl"
