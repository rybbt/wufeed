name: format

# Fails a PR whose Markdown, YAML or JSON is not Prettier-formatted.
# docs/ (the generated feed) is excluded in .prettierignore.
# Fix locally: npx prettier@3.9.10 --write .

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # started by update-feed on its feed branch

permissions:
  contents: read
  statuses: write # report the result on a dispatched run

jobs:
  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prettier check
        run: npx --yes prettier@3.9.10 --check .

      # A check run from a dispatched workflow is not linked to the pull request, so it
      # does not satisfy the required check. Report the result as a commit status.
      - name: Report status
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          [ "$RESULT" = success ] && state=success
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context=prettier \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
