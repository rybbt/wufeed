name: format

# Fails a PR whose Markdown, YAML or JSON is not Prettier-formatted.
# docs/ (the generated feed) is excluded in .prettierignore.
# Fix locally: npx prettier@3.9.10 --write .

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prettier check
        run: npx --yes prettier@3.9.10 --check .
